name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and package Keybinderr
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Keybinderr.sln

      - name: Build
        run: dotnet build .\Keybinderr.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\Keybinderr.sln --configuration Release --no-build

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Package installer
        shell: pwsh
        run: .\scripts\package.ps1 -Configuration Release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeybinderrSetup
          path: artifacts\installer\KeybinderrSetup.exe
          if-no-files-found: error
